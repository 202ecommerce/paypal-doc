site_name: Documentation fonctionnelle – Module PayPal PrestaShop
site_description: Guide fonctionnel du module PayPal pour PrestaShop
docs_dir: docs
site_dir: site
theme:
  name: material
  language: fr
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Accueil: index.md
  - Moyens de paiement: moyens-paiement.md
  - Configuration: configuration.md
  - Parcours client: tunnel-paiement.md
  - Remboursements et annulations: remboursements.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - with-pdf:
      output_path: pdf/documentation-paypal.pdf
      cover_title: Documentation fonctionnelle – Module PayPal PrestaShop
      cover_subtitle: Guide utilisateur
      toc_title: Sommaire
      author: 202ecommerce
      cover_logo: null
      enabled_if_env: ENABLE_PDF_EXPORT
