site_name: Module PayPal Officiel pour PrestaShop
site_description: Documentation utilisateur du module PayPal V6 pour PrestaShop 1.7 et supérieur
site_url: https://202ecommerce.github.io/paypal-doc/
repo_url: https://github.com/202ecommerce/paypal-doc
repo_name: 202ecommerce/paypal-doc
copyright: Documentation éditée par 202-ecommerce
docs_dir: docs
site_dir: site

theme:
  name: material
  language: fr
  logo: assets/logo-paypal.png
  favicon: assets/logo-paypal.png
  font:
    text: Archivo
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/css/paypal.css

nav:
  - Accueil: index.md
  - Général: general.md
  - Fonctionnalités communes:
      - Installation du module: installation.md
      - Naviguer dans la page de configuration: navigation.md
      - Configurations disponibles: configuration.md
      - On Boarding: onboarding.md
      - Remboursement d’une transaction: remboursements.md
  - Fonctionnalités par pays:
      - Allemagne: specificites-allemagne.md
      - USA: specificites-usa.md
      - Mexique / Brésil: specificites-mexique-bresil.md
  - Utilisation: utilisation.md
  - Pré-requis: prerequis.md
  - Contact: contact.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      permalink_title: Lien vers cette section

plugins:
  - search:
      lang: fr
  - with-pdf:
      output_path: pdf/documentation-paypal.pdf
      cover_title: Documentation utilisateur – Module PayPal Officiel
      cover_subtitle: Module PayPal V6.X pour PrestaShop V1.7.X et supérieur
      toc_title: Sommaire
      author: 202ecommerce
      cover_logo: docs/assets/logo-paypal.png
      enabled_if_env: ENABLE_PDF_EXPORT
