name: Build & Deploy Documentation

on:
  push:
    branches: [main]
  # Sur une pull request, on construit sans déployer : c'est le seul moyen de
  # vérifier l'export PDF avant la fusion, puisqu'il exige des bibliothèques
  # système absentes des postes de développement.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Dépendances système requises par WeasyPrint (moteur du plugin PDF)
      - name: Install system dependencies for PDF export
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 libcairo2 \
            libffi-dev shared-mime-info

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # --strict : un lien mort ou une page absente de nav: fait échouer le build
      - name: Build site (HTML + PDF)
        env:
          ENABLE_PDF_EXPORT: "1"
        run: mkdocs build --strict

      # Sur une pull request, les PDF sont téléchargeables depuis la page du run :
      # c'est le seul moyen de relire le document avant la fusion.
      - name: Upload PDFs
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pdf
          path: |
            site/pdf/documentation-paypal.pdf
            site/en/pdf/documentation-paypal.pdf

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
